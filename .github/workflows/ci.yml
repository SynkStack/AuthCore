name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authcore
          POSTGRES_PASSWORD: authcore_ci_pw
          POSTGRES_DB: authcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authcore -d authcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://authcore:authcore_ci_pw@localhost:5432/authcore_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    runs-on: ubuntu-latest
    needs: test # only runs if the tests passed

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t authcore:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name authcore-smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://unused:unused@localhost:5432/unused \
            -e JWT_ACCESS_SECRET=ci-smoke-secret \
            authcore:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs authcore-smoke
          exit 1